<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MJ Budget Spreadsheet System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { touch-action: manipulation; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-stone-900 text-slate-100 min-h-screen font-sans p-2 sm:p-6 overflow-x-hidden">

  <!-- Main Container Layout แบบ Excel ในรูป -->
  <div class="max-w-6xl mx-auto bg-[#232323] border border-stone-800 rounded-2xl p-4 sm:p-6 shadow-2xl space-y-6">
    
    <!-- Header Bar -->
    <div class="flex justify-between items-center border-b border-stone-800 pb-4">
      <div>
        <h1 class="text-xl sm:text-2xl font-bold text-amber-400">📊 ตารางงบประมาณ & บัญชีสรุปรายเดือน</h1>
        <p class="text-xs text-stone-400">หจก. เอ็มเจ ไฟแนนซ์ (ตั้งชื่อรายการ กรอกตัวเลข และคำนวณอัตโนมัติ)</p>
      </div>
      <button onclick="addRow('income')" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-3 py-2 rounded-xl font-bold transition">
        + เพิ่มแถวรายรับ
      </button>
      <button onclick="addRow('expense')" class="bg-rose-600 hover:bg-rose-500 text-white text-xs px-3 py-2 rounded-xl font-bold transition">
        + เพิ่มแถวรายจ่าย
      </button>
    </div>

    <!-- Main Sheet Grid -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
      
      <!-- Left Column: ตารางหลัก (รายรับ + รายจ่าย) -->
      <div class="lg:col-span-8 space-y-6">
        
        <!-- SECTION 1: รายรับรายเดือน -->
        <div class="space-y-2">
          <div class="grid grid-cols-12 text-xs font-bold text-emerald-400 pb-2 border-b border-stone-700">
            <span class="col-span-5">รายรับรายเดือน</span>
            <span class="col-span-2 text-right">ประมาณ</span>
            <span class="col-span-3 text-right">รับจริง</span>
            <span class="col-span-2 text-right">ผลต่าง</span>
          </div>

          <div id="incomeRows" class="space-y-2">
            <!-- Dynamic Income Rows -->
          </div>

          <!-- ผลรวมรายรับ -->
          <div class="grid grid-cols-12 text-sm font-bold text-emerald-400 pt-2 border-t border-stone-700">
            <span class="col-span-5">ผลรวมรายรับ</span>
            <span id="totIncEst" class="col-span-2 text-right">0</span>
            <span id="totIncAct" class="col-span-3 text-right">0</span>
            <span id="totIncDiff" class="col-span-2 text-right">0</span>
          </div>
        </div>

        <!-- SECTION 2: รายจ่ายการทำงาน -->
        <div class="space-y-2 pt-4">
          <div class="grid grid-cols-12 text-xs font-bold text-amber-500 pb-2 border-b border-stone-700">
            <span class="col-span-5">รายจ่ายการทำงาน</span>
            <span class="col-span-2 text-right">ประมาณ</span>
            <span class="col-span-3 text-right">จ่ายจริง</span>
            <span class="col-span-2 text-right">ผลต่าง</span>
          </div>

          <div id="expenseRows" class="space-y-2">
            <!-- Dynamic Expense Rows -->
          </div>

          <!-- ผลรวมรายจ่าย -->
          <div class="grid grid-cols-12 text-sm font-bold text-amber-500 pt-2 border-t border-stone-700">
            <span class="col-span-5">ผลรวมรายจ่าย</span>
            <span id="totExpEst" class="col-span-2 text-right">0</span>
            <span id="totExpAct" class="col-span-3 text-right">0</span>
            <span id="totExpDiff" class="col-span-2 text-right">0</span>
          </div>
        </div>

      </div>

      <!-- Right Column: ตารางเสริม (รายรับเพิ่มเติม / รายจ่ายฝั่งไทย) -->
      <div class="lg:col-span-4 space-y-6 bg-[#1a1a1a] p-4 rounded-xl border border-stone-800">
        <!-- รายรับ/ต่อเดือน Extra -->
        <div class="space-y-2">
          <h3 class="text-xs font-bold text-emerald-400 border-b border-stone-700 pb-1">รายรับ/ต่อเดือน</h3>
          <div class="space-y-2">
            <div class="flex justify-between items-center text-xs">
              <input type="text" value="เงินเดือน" class="bg-transparent border-b border-stone-800 text-stone-300 w-3/5 focus:outline-none">
              <input type="number" value="28000" oninput="calculate()" class="extraIncVal bg-stone-900 border border-stone-700 rounded px-2 py-1 text-right w-2/5 text-emerald-400 font-bold focus:outline-none">
            </div>
            <div class="flex justify-between items-center text-xs">
              <input type="text" value="บัตร Finnix" class="bg-transparent border-b border-stone-800 text-stone-300 w-3/5 focus:outline-none">
              <input type="number" value="500" oninput="calculate()" class="extraIncVal bg-stone-900 border border-stone-700 rounded px-2 py-1 text-right w-2/5 text-emerald-400 font-bold focus:outline-none">
            </div>
            <div class="flex justify-between items-center text-xs">
              <input type="text" value="บัตร Promise" class="bg-transparent border-b border-stone-800 text-stone-300 w-3/5 focus:outline-none">
              <input type="number" value="400" oninput="calculate()" class="extraIncVal bg-stone-900 border border-stone-700 rounded px-2 py-1 text-right w-2/5 text-emerald-400 font-bold focus:outline-none">
            </div>
          </div>
        </div>

        <!-- รายจ่ายฝั่งไทย Extra -->
        <div class="space-y-2 pt-4 border-t border-stone-800">
          <h3 class="text-xs font-bold text-rose-400 border-b border-stone-700 pb-1">รายจ่ายฝั่งไทย</h3>
          <div class="space-y-2">
            <div class="flex justify-between items-center text-xs">
              <input type="text" value="ให้ครอบครัว" class="bg-transparent border-b border-stone-800 text-rose-300 w-3/5 focus:outline-none">
              <input type="number" value="16000" oninput="calculate()" class="extraExpVal bg-stone-900 border border-stone-700 rounded px-2 py-1 text-right w-2/5 text-rose-400 font-bold focus:outline-none">
            </div>
            <div class="flex justify-between items-center text-xs">
              <input type="text" value="ค่าเลี้ยงบุตร***" class="bg-transparent border-b border-stone-800 text-rose-300 w-3/5 focus:outline-none">
              <input type="number" value="800" oninput="calculate()" class="extraExpVal bg-stone-900 border border-stone-700 rounded px-2 py-1 text-right w-2/5 text-rose-400 font-bold focus:outline-none">
            </div>
          </div>
        </div>
      </div>

    </div>

    <!-- Bottom Summary Box (กล่องสรุปสีทองด้านล่างสุด) -->
    <div class="bg-stone-950 border border-amber-500/40 rounded-2xl p-4 sm:p-6 text-center shadow-xl">
      <div class="grid grid-cols-3 divide-x divide-stone-800">
        <div>
          <p class="text-xs text-stone-400 font-semibold mb-1">ผลรวมรายรับ</p>
          <p id="finalTotalIncome" class="text-lg sm:text-2xl font-extrabold text-emerald-400">0</p>
        </div>
        <div>
          <p class="text-xs text-stone-400 font-semibold mb-1">ผลรวมรายจ่าย</p>
          <p id="finalTotalExpense" class="text-lg sm:text-2xl font-extrabold text-rose-400">0</p>
        </div>
        <div>
          <p class="text-xs text-amber-400 font-semibold mb-1">คงเหลือ</p>
          <p id="finalBalance" class="text-xl sm:text-4xl font-black text-amber-400 tracking-tight">0</p>
        </div>
      </div>
    </div>

  </div>

  <script>
    // ข้อมูลเริ่มต้นตามรูปภาพของ MJ
    const defaultIncomes = [
      { name: "เงินเดือน (สุทธิ)", est: 11200, act: 11200 },
      { name: "รายรับอื่นๆ A", est: 1100, act: 1100 },
      { name: "รายรับอื่นๆ ฝ้าย", est: 0, act: 0 },
      { name: "รายรับอื่นๆ", est: 0, act: 0 }
    ];

    const defaultExpenses = [
      { name: "ค่าอาหาร (25 วัน)", est: 1500, act: 1500 },
      { name: "ค่าของใช้ในห้อง (7 วัน)", est: 350, act: 350 },
      { name: "ค่าเดินทาง (หาร 2 คน)", est: 1000, act: 1000 },
      { name: "ค่าของใช้ (ต่อเดือน)", est: 500, act: 500 },
      { name: "ค่าเน็ตที่พัก (ที่ทำงาน)", est: 250, act: 249 },
      { name: "อื่นๆ ค่าเน็ตรายเดือนทรู", est: 200, act: 191.53 },
      { name: "เงินออม (บัญชีออมสิน)", est: 500, act: 500 }
    ];

    function createRowHTML(type, data = { name: '', est: 0, act: 0 }) {
      const textColor = type === 'income' ? 'text-emerald-400' : 'text-amber-400';
      return `
        <div class="grid grid-cols-12 gap-1 items-center text-xs ${type}-row">
          <input type="text" value="${data.name}" placeholder="ชื่อรายการ..." class="col-span-5 bg-transparent border-b border-stone-800 ${textColor} focus:border-amber-400 focus:outline-none px-1">
          <input type="number" step="0.01" value="${data.est}" oninput="calculate()" class="col-span-2 bg-stone-900 border border-stone-800 rounded text-right px-1 py-1 text-stone-200 focus:outline-none row-est">
          <input type="number" step="0.01" value="${data.act}" oninput="calculate()" class="col-span-3 bg-stone-900 border border-stone-800 rounded text-right px-1 py-1 text-stone-200 focus:outline-none row-act">
          <span class="col-span-2 text-right text-stone-400 font-mono row-diff">0</span>
        </div>
      `;
    }

    function init() {
      const incBox = document.getElementById('incomeRows');
      const expBox = document.getElementById('expenseRows');

      incBox.innerHTML = defaultIncomes.map(item => createRowHTML('income', item)).join('');
      expBox.innerHTML = defaultExpenses.map(item => createRowHTML('expense', item)).join('');

      calculate();
    }

    function addRow(type) {
      const box = document.getElementById(type === 'income' ? 'incomeRows' : 'expenseRows');
      box.insertAdjacentHTML('beforeend', createRowHTML(type));
      calculate();
    }

    function calculate() {
      // คำนวณฝั่งรายรับ
      let totIncEst = 0, totIncAct = 0, totIncDiff = 0;
      document.querySelectorAll('.income-row').forEach(row => {
        const est = parseFloat(row.querySelector('.row-est').value) || 0;
        const act = parseFloat(row.querySelector('.row-act').value) || 0;
        const diff = est - act;
        row.querySelector('.row-diff').textContent = diff.toLocaleString('th-TH', {minimumFractionDigits: 0, maximumFractionDigits: 2});
        totIncEst += est;
        totIncAct += act;
        totIncDiff += diff;
      });

      document.getElementById('totIncEst').textContent = totIncEst.toLocaleString('th-TH');
      document.getElementById('totIncAct').textContent = totIncAct.toLocaleString('th-TH');
      document.getElementById('totIncDiff').textContent = totIncDiff.toLocaleString('th-TH');

      // คำนวณฝั่งรายจ่าย
      let totExpEst = 0, totExpAct = 0, totExpDiff = 0;
      document.querySelectorAll('.expense-row').forEach(row => {
        const est = parseFloat(row.querySelector('.row-est').value) || 0;
        const act = parseFloat(row.querySelector('.row-act').value) || 0;
        const diff = est - act;
        row.querySelector('.row-diff').textContent = diff.toLocaleString('th-TH', {minimumFractionDigits: 0, maximumFractionDigits: 2});
        totExpEst += est;
        totExpAct += act;
        totExpDiff += diff;
      });

      document.getElementById('totExpEst').textContent = totExpEst.toLocaleString('th-TH');
      document.getElementById('totExpAct').textContent = totExpAct.toLocaleString('th-TH');
      document.getElementById('totExpDiff').textContent = totExpDiff.toLocaleString('th-TH');

      // คำนวณกล่องสรุปด้านล่างสุด
      const finalInc = totIncAct;
      const finalExp = totExpAct;
      const finalBal = finalInc - finalExp;

      document.getElementById('finalTotalIncome').textContent = finalInc.toLocaleString('th-TH', {minimumFractionDigits: 0, maximumFractionDigits: 2});
      document.getElementById('finalTotalExpense').textContent = finalExp.toLocaleString('th-TH', {minimumFractionDigits: 0, maximumFractionDigits: 2});
      document.getElementById('finalBalance').textContent = finalBal.toLocaleString('th-TH', {minimumFractionDigits: 0, maximumFractionDigits: 2});
    }

    init();
  </script>
</body>
</html>
