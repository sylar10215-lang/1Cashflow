<!-- Firebase Scripts (Modular SDK v10) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, query, orderBy 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 🔴 1. วาง Firebase Config ของ MJ ตรงนี้เลย
    const firebaseConfig = {
  apiKey: "AIzaSyDmAc0U5-f-NLeYQpCvFPa8SgGr7_Cm9Bk",
  authDomain: "cashflow-e8505.firebaseapp.com",
  databaseURL: "https://cashflow-e8505-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "cashflow-e8505",
  storageBucket: "cashflow-e8505.firebasestorage.app",
  messagingSenderId: "841200170286",
  appId: "1:841200170286:web:e418345aea281ca1eb36bf"
};
    
    // 🟢 ประกาศตัวแปร Collection ไว้ที่ Top-Level ให้เรียกใช้ได้ทั่วถึง
    const transCollection = collection(db, "transactions");

    // หมวดหมู่เริ่มต้น
    const categories = {
      income: ["เงินเดือน", "โบนัส", "ธุรกิจส่วนตัว", "การลงทุน", "อื่นๆ"],
      expense: ["อาหาร/เครื่องดื่ม", "การเดินทาง", "ที่พัก/ค่าน้ำค่าไฟ", "ช้อปปิ้ง", "ความบันเทิง", "อื่นๆ"]
    };

    // DOM Elements
    const typeSelect = document.getElementById("type");
    const categorySelect = document.getElementById("category");
    const form = document.getElementById("transactionForm");
    const transactionList = document.getElementById("transactionList");
    const dateInput = document.getElementById("date");

    const filterType = document.getElementById("filterType");
    const filterValueContainer = document.getElementById("filterValueContainer");
    const filterDate = document.getElementById("filterDate");
    const filterMonth = document.getElementById("filterMonth");
    const filterYear = document.getElementById("filterYear");

    // ตั้งค่าวันที่ปัจจุบันเป็นค่าเริ่มต้น
    const today = new Date().toISOString().split("T")[0];
    dateInput.value = today;
    filterDate.value = today;
    filterMonth.value = today.slice(0, 7);
    filterYear.value = new Date().getFullYear();

    let allTransactions = [];

    // เปลี่ยนหมวดหมู่ตามประเภท (รายรับ/รายจ่าย)
    function updateCategories() {
      const selectedType = typeSelect.value;
      categorySelect.innerHTML = categories[selectedType]
        .map(cat => `<option value="${cat}">${cat}</option>`)
        .join("");
    }
    typeSelect.addEventListener("change", updateCategories);
    updateCategories();

    // 🟢 เพิ่มรายการลง Firebase (ใช้ transCollection ที่ประกาศไว้ข้างบน)
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const newTransaction = {
        type: typeSelect.value,
        amount: parseFloat(document.getElementById("amount").value),
        category: categorySelect.value,
        title: document.getElementById("title").value,
        date: dateInput.value,
        createdAt: new Date()
      };

      try {
        await addDoc(transCollection, newTransaction);
        form.reset();
        dateInput.value = today;
        updateCategories();
      } catch (err) {
        alert("เกิดข้อผิดพลาดในการบันทึก: " + err.message);
      }
    });

    // 🟢 ลบรายการ (ผูกฟังก์ชันไว้กับ window เพื่อให้กดจาก HTML ได้)
    window.deleteTransaction = async (id) => {
      if (confirm("ต้องการลบรายการนี้ใช่ไหม?")) {
        try {
          await deleteDoc(doc(db, "transactions", id));
        } catch (err) {
          alert("เกิดข้อผิดพลาดในการลบ: " + err.message);
        }
      }
    };

    // 🟢 ดึงข้อมูล Realtime จาก Firebase
    const q = query(transCollection, orderBy("date", "desc"));
    onSnapshot(q, (snapshot) => {
      allTransactions = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      renderUI();
    }, (error) => {
      console.error("Firebase Error: ", error);
    });

    // กรองข้อมูล + คำนวณยอดรวมสรุป
    function renderUI() {
      const mode = filterType.value;
      let filtered = allTransactions;

      if (mode === "daily" && filterDate.value) {
        filtered = allTransactions.filter(item => item.date === filterDate.value);
      } else if (mode === "monthly" && filterMonth.value) {
        filtered = allTransactions.filter(item => item.date && item.date.startsWith(filterMonth.value));
      } else if (mode === "yearly" && filterYear.value) {
        filtered = allTransactions.filter(item => item.date && item.date.startsWith(filterYear.value));
      }

      // คำนวณสรุปยอดรวม
      let totalInc = 0;
      let totalExp = 0;

      filtered.forEach(item => {
        if (item.type === "income") totalInc += item.amount;
        if (item.type === "expense") totalExp += item.amount;
      });

      const balance = totalInc - totalExp;

      // แสดงผลหน้าสรุป
      document.getElementById("totalIncome").textContent = `฿${totalInc.toLocaleString('th-TH', {minimumFractionDigits: 2})}`;
      document.getElementById("totalExpense").textContent = `฿${totalExp.toLocaleString('th-TH', {minimumFractionDigits: 2})}`;
      
      const balanceEl = document.getElementById("totalBalance");
      balanceEl.textContent = `฿${balance.toLocaleString('th-TH', {minimumFractionDigits: 2})}`;
      balanceEl.className = `text-2xl font-bold mt-2 ${balance >= 0 ? 'text-sky-600' : 'text-rose-600'}`;

      // แสดงรายการในตาราง
      transactionList.innerHTML = filtered.map(item => `
        <tr class="hover:bg-slate-50">
          <td class="p-3 text-slate-500">${item.date}</td>
          <td class="p-3">
            <span class="px-2.5 py-1 rounded-full text-xs font-semibold ${item.type === 'income' ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}">
              ${item.type === 'income' ? 'รายรับ' : 'รายจ่าย'}
            </span>
          </td>
          <td class="p-3 font-medium text-slate-700">${item.category}</td>
          <td class="p-3 text-slate-600">${item.title}</td>
          <td class="p-3 text-right font-semibold ${item.type === 'income' ? 'text-emerald-600' : 'text-rose-600'}">
            ${item.type === 'income' ? '+' : '-'}${item.amount.toLocaleString('th-TH', {minimumFractionDigits: 2})}
          </td>
          <td class="p-3 text-center">
            <button onclick="deleteTransaction('${item.id}')" class="text-slate-400 hover:text-rose-500 transition">🗑️</button>
          </td>
        </tr>
      `).join("");
    }

    // สลับซ่อน/แสดงช่องเลือกตัวกรอง
    filterType.addEventListener("change", () => {
      const mode = filterType.value;
      if (mode === "all") {
        filterValueContainer.classList.add("hidden");
      } else {
        filterValueContainer.classList.remove("hidden");
        filterDate.classList.toggle("hidden", mode !== "daily");
        filterMonth.classList.toggle("hidden", mode !== "monthly");
        filterYear.classList.toggle("hidden", mode !== "yearly");
      }
      renderUI();
    });

    filterDate.addEventListener("change", renderUI);
    filterMonth.addEventListener("change", renderUI);
    filterYear.addEventListener("input", renderUI);
  </script>
