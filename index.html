<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>แอปรายรับ-รายจ่าย - MJ</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

  <div class="max-w-4xl mx-auto p-4 md:p-6 space-y-6">
    <!-- Header -->
    <header class="text-center py-4 bg-white rounded-2xl shadow-sm border border-slate-200">
      <h1 class="text-2xl md:text-3xl font-bold text-sky-600">💰 ระบบบันทึกรายรับ - รายจ่าย</h1>
      <p class="text-slate-500 text-sm mt-1">จัดการการเงินใกล้มือคุณ</p>
    </header>

    <!-- สรุปรวมส่วนต่าง (Dashboard) -->
    <section class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div class="bg-white p-5 rounded-2xl shadow-sm border-l-4 border-emerald-500">
        <p class="text-sm font-medium text-slate-500">ยอดรวมรายรับ</p>
        <p id="totalIncome" class="text-2xl font-bold text-emerald-600 mt-2">฿0.00</p>
      </div>
      <div class="bg-white p-5 rounded-2xl shadow-sm border-l-4 border-rose-500">
        <p class="text-sm font-medium text-slate-500">ยอดรวมรายจ่าย</p>
        <p id="totalExpense" class="text-2xl font-bold text-rose-600 mt-2">฿0.00</p>
      </div>
      <div class="bg-white p-5 rounded-2xl shadow-sm border-l-4 border-sky-500">
        <p class="text-sm font-medium text-slate-500">คงเหลือ (ส่วนต่าง)</p>
        <p id="totalBalance" class="text-2xl font-bold text-sky-600 mt-2">฿0.00</p>
      </div>
    </section>

    <!-- ตัวกรองเวลา (Filter) -->
    <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex flex-wrap gap-3 items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="font-semibold text-slate-700">🗓️ ตัวกรอง:</span>
        <select id="filterType" class="p-2 border rounded-xl bg-slate-50 text-sm focus:ring-2 focus:ring-sky-400 outline-none">
          <option value="all">ทั้งหมด</option>
          <option value="daily">รายวัน</option>
          <option value="monthly">รายเดือน</option>
          <option value="yearly">รายปี</option>
        </select>
      </div>
      <div id="filterValueContainer" class="hidden">
        <input type="date" id="filterDate" class="p-2 border rounded-xl bg-slate-50 text-sm focus:ring-2 focus:ring-sky-400 outline-none">
        <input type="month" id="filterMonth" class="p-2 border rounded-xl bg-slate-50 text-sm focus:ring-2 focus:ring-sky-400 outline-none hidden">
        <input type="number" id="filterYear" placeholder="ปี ค.ศ. เช่น 2026" class="p-2 border rounded-xl bg-slate-50 text-sm focus:ring-2 focus:ring-sky-400 outline-none hidden w-36">
      </div>
    </section>

    <!-- ฟอร์มบันทึกรายการ -->
    <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
      <h2 class="text-lg font-bold text-slate-700 mb-4">➕ บันทึกรายการใหม่</h2>
      <form id="transactionForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm text-slate-600 mb-1">ประเภทรายการ</label>
          <select id="type" class="w-full p-2.5 border rounded-xl bg-slate-50 focus:ring-2 focus:ring-sky-400 outline-none">
            <option value="expense">🔻 รายจ่าย</option>
            <option value="income">🟢 รายรับ</option>
          </select>
        </div>

        <div>
          <label class="block text-sm text-slate-600 mb-1">จำนวนเงิน (บาท)</label>
          <input type="number" id="amount" step="0.01" required placeholder="0.00" class="w-full p-2.5 border rounded-xl bg-slate-50 focus:ring-2 focus:ring-sky-400 outline-none">
        </div>

        <div>
          <label class="block text-sm text-slate-600 mb-1">หมวดหมู่</label>
          <select id="category" class="w-full p-2.5 border rounded-xl bg-slate-50 focus:ring-2 focus:ring-sky-400 outline-none">
            <!-- Dynamic Options -->
          </select>
        </div>

        <div>
          <label class="block text-sm text-slate-600 mb-1">รายละเอียด / หมายเหตุ</label>
          <input type="text" id="title" required placeholder="เช่น ค่าข้าวเช้า, เงินเดือน" class="w-full p-2.5 border rounded-xl bg-slate-50 focus:ring-2 focus:ring-sky-400 outline-none">
        </div>

        <div>
          <label class="block text-sm text-slate-600 mb-1">วันที่ทำรายการ</label>
          <input type="date" id="date" required class="w-full p-2.5 border rounded-xl bg-slate-50 focus:ring-2 focus:ring-sky-400 outline-none">
        </div>

        <div class="md:col-span-2 flex justify-end">
          <button type="submit" class="bg-sky-500 hover:bg-sky-600 text-white px-6 py-2.5 rounded-xl font-medium transition shadow-sm">
            บันทึกรายการ
          </button>
        </div>
      </form>
    </section>

    <!-- ตารางแสดงรายการ -->
    <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
      <h2 class="text-lg font-bold text-slate-700 mb-4">📜 ประวัติรายการ</h2>
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="border-b border-slate-200 text-slate-400 text-sm">
              <th class="p-3">วันที่</th>
              <th class="p-3">ประเภท</th>
              <th class="p-3">หมวดหมู่</th>
              <th class="p-3">รายการ</th>
              <th class="p-3 text-right">จำนวนเงิน</th>
              <th class="p-3 text-center">จัดการ</th>
            </tr>
          </thead>
          <tbody id="transactionList" class="divide-y divide-slate-100 text-sm">
            <!-- Loaded items from Firebase -->
          </tbody>
        </table>
      </div>
    </section>
  </div>

  <!-- Firebase Scripts (Modular SDK v10) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, query, orderBy 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 🔴 1. วาง Firebase Config ของ MJ ตรงนี้เลยค่ะ
    const firebaseConfig = {
  apiKey: "AIzaSyDmAc0U5-f-NLeYQpCvFPa8SgGr7_Cm9Bk",
  authDomain: "cashflow-e8505.firebaseapp.com",
  databaseURL: "https://cashflow-e8505-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "cashflow-e8505",
  storageBucket: "cashflow-e8505.firebasestorage.app",
  messagingSenderId: "841200170286",
  appId: "1:841200170286:web:e418345aea281ca1eb36bf"
};

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const transCollection = collection(db, "transactions");

    // หมวดหมู่เริ่มต้น (สามารถเพิ่มเพิ่มหมวดหมู่ตรงนี้ได้ง่ายๆ เลย)
    const categories = {
      income: ["เงินเดือน", "โบนัส", "ธุรกิจส่วนตัว", "การลงทุน", "อื่นๆ"],
      expense: ["อาหาร/เครื่องดื่ม", "การเดินทาง", "ที่พัก/ค่าน้ำค่าไฟ", "ช้อปปิ้ง", "ความบันเทิง", "อื่นๆ"]
    };

    // DOM Elements
    const typeSelect = document.getElementById("type");
    const categorySelect = document.getElementById("category");
    const form = document.getElementById("transactionForm");
    const transactionList = document.getElementById("transactionList");
    const dateInput = document.getElementById("date");

    const filterType = document.getElementById("filterType");
    const filterValueContainer = document.getElementById("filterValueContainer");
    const filterDate = document.getElementById("filterDate");
    const filterMonth = document.getElementById("filterMonth");
    const filterYear = document.getElementById("filterYear");

    // ตั้งค่า วันที่ปัจจุบัน เป็นค่าเริ่มต้น
    const today = new Date().toISOString().split("T")[0];
    dateInput.value = today;
    filterDate.value = today;
    filterMonth.value = today.slice(0, 7);
    filterYear.value = new Date().getFullYear();

    let allTransactions = [];

    // เปลี่ยนหมวดหมู่ตามประเภท (รายรับ/รายจ่าย)
    function updateCategories() {
      const selectedType = typeSelect.value;
      categorySelect.innerHTML = categories[selectedType]
        .map(cat => `<option value="${cat}">${cat}</option>`)
        .join("");
    }
    typeSelect.addEventListener("change", updateCategories);
    updateCategories();

    // เพิ่มรายการลง Firebase
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const newTransaction = {
        type: typeSelect.value,
        amount: parseFloat(document.getElementById("amount").value),
        category: categorySelect.value,
        title: document.getElementById("title").value,
        date: dateInput.value,
        createdAt: new Date()
      };

      try {
        await addDoc(transCollection, newTransaction);
        form.reset();
        dateInput.value = today;
        updateCategories();
      } catch (err) {
        alert("เกิดข้อผิดพลาดในการบันทึก: " + err.message);
      }
    });

    // ลบรายการ
    window.deleteTransaction = async (id) => {
      if (confirm("ต้องการลบรายการนี้ใช่ไหม?")) {
        await deleteDoc(doc(db, "transactions", id));
      }
    };

    // ดึงข้อมูล Realtime จาก Firebase
    const q = query(transCollection, orderBy("date", "desc"));
    onSnapshot(q, (snapshot) => {
      allTransactions = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      renderUI();
    });

    // กรองข้อมูล + คำนวณยอดรวมสรุป
    function renderUI() {
      const mode = filterType.value;
      let filtered = allTransactions;

      if (mode === "daily" && filterDate.value) {
        filtered = allTransactions.filter(item => item.date === filterDate.value);
      } else if (mode === "monthly" && filterMonth.value) {
        filtered = allTransactions.filter(item => item.date.startsWith(filterMonth.value));
      } else if (mode === "yearly" && filterYear.value) {
        filtered = allTransactions.filter(item => item.date.startsWith(filterYear.value));
      }

      // คำนวณสรุปยอดรวม
      let totalInc = 0;
      let totalExp = 0;

      filtered.forEach(item => {
        if (item.type === "income") totalInc += item.amount;
        if (item.type === "expense") totalExp += item.amount;
      });

      const balance = totalInc - totalExp;

      // แสดงผลหน้าสรุป
      document.getElementById("totalIncome").textContent = `฿${totalInc.toLocaleString('th-TH', {minimumFractionDigits: 2})}`;
      document.getElementById("totalExpense").textContent = `฿${totalExp.toLocaleString('th-TH', {minimumFractionDigits: 2})}`;
      
      const balanceEl = document.getElementById("totalBalance");
      balanceEl.textContent = `฿${balance.toLocaleString('th-TH', {minimumFractionDigits: 2})}`;
      balanceEl.className = `text-2xl font-bold mt-2 ${balance >= 0 ? 'text-sky-600' : 'text-rose-600'}`;

      // แสดงรายการในตาราง
      transactionList.innerHTML = filtered.map(item => `
        <tr class="hover:bg-slate-50">
          <td class="p-3 text-slate-500">${item.date}</td>
          <td class="p-3">
            <span class="px-2.5 py-1 rounded-full text-xs font-semibold ${item.type === 'income' ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}">
              ${item.type === 'income' ? 'รายรับ' : 'รายจ่าย'}
            </span>
          </td>
          <td class="p-3 font-medium text-slate-700">${item.category}</td>
          <td class="p-3 text-slate-600">${item.title}</td>
          <td class="p-3 text-right font-semibold ${item.type === 'income' ? 'text-emerald-600' : 'text-rose-600'}">
            ${item.type === 'income' ? '+' : '-'}${item.amount.toLocaleString('th-TH', {minimumFractionDigits: 2})}
          </td>
          <td class="p-3 text-center">
            <button onclick="deleteTransaction('${item.id}')" class="text-slate-400 hover:text-rose-500 transition">🗑️</button>
          </td>
        </tr>
      `).join("");
    }

    // สลับซ่อน/แสดงช่องเลือกตัวกรอง
    filterType.addEventListener("change", () => {
      const mode = filterType.value;
      if (mode === "all") {
        filterValueContainer.classList.add("hidden");
      } else {
        filterValueContainer.classList.remove("hidden");
        filterDate.classList.toggle("hidden", mode !== "daily");
        filterMonth.classList.toggle("hidden", mode !== "monthly");
        filterYear.classList.toggle("hidden", mode !== "yearly");
      }
      renderUI();
    });

    filterDate.addEventListener("change", renderUI);
    filterMonth.addEventListener("change", renderUI);
    filterYear.addEventListener("input", renderUI);
  </script>
</body>
</html>
